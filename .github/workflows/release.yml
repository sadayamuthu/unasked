name: Release

# Push a tag like v0.1.0 to publish a GitHub Release with prebuilt binaries
# (.tar.gz for macOS and Linux, .zip for Windows) and .deb/.rpm packages, a
# Docker image on GHCR and the Homebrew formula in sadayamuthu/homebrew-tap,
# and to move the major tag (v0) that `uses: sadayamuthu/unasked@v0`
# resolves to.
# Run it manually (Actions → Release → Run workflow) to build every binary
# without publishing anything.
on:
  push:
    tags: ['v*.*.*']   # not v0: that tag only tracks the latest release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -short ./...
        env:
          # Recall wins over the false-alarm ceiling; see CONTRIBUTING.md#fixtures.
          UNASKED_RELAX_CEILING: '1'

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        # unasked is pure Go, so every target cross-compiles on one runner.
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bin=unasked
          [ "$GOOS" = windows ] && bin=unasked.exe
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${bin}" ./cmd/unasked
          file "dist/${bin}"
      - name: Smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./dist/unasked version
      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="unasked_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          cp LICENSE README.md USAGE.md dist/
          if [ "${{ matrix.goos }}" = windows ]; then
            (cd dist && zip -q "../${name}.zip" unasked.exe LICENSE README.md USAGE.md)
            echo "file=${name}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "${name}.tar.gz" -C dist unasked LICENSE README.md USAGE.md
            echo "file=${name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
      - name: Linux packages (.deb, .rpm)
        if: matrix.goos == 'linux'
        env:
          TAG: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.goarch }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          if [[ "$TAG" == v* ]]; then VERSION="${TAG#v}"; else VERSION="0.0.0~${TAG}"; fi
          export VERSION
          nfpm package -f packaging/nfpm.yaml -p deb -t .
          nfpm package -f packaging/nfpm.yaml -p rpm -t .
          ls -la *.deb *.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.file }}
            *.deb
            *.rpm
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip *.deb *.rpm > checksums.txt
          cat checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes $prerelease

  # Multi-arch image on GHCR, used by `docker run`. Manual runs build it
  # without pushing.
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
            tags="${image}:${version#v}"
            [[ "$version" != *-* ]] && tags="${tags},${image}:latest"
          else
            version="dev-${GITHUB_SHA::7}"
            tags="${image}:${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # Updates Formula/unasked.rb in sadayamuthu/homebrew-tap. Needs the
  # HOMEBREW_TAP_TOKEN secret: a fine-grained token with Contents read/write on
  # that repository only. Skipped for prereleases and when the secret is unset.
  homebrew:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check for token
        if: env.TAP_TOKEN == ''
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew formula update."
      - uses: actions/checkout@v4
        if: env.TAP_TOKEN != ''
      - uses: actions/download-artifact@v4
        if: env.TAP_TOKEN != ''
        with:
          path: dist
          merge-multiple: true
      - name: Update formula
        if: env.TAP_TOKEN != ''
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/sadayamuthu/homebrew-tap.git" tap
          mkdir -p tap/Formula
          packaging/homebrew-formula.sh "$TAG" dist > tap/Formula/unasked.rb
          cd tap
          git add Formula/unasked.rb
          git diff --cached --stat
          git -c user.name=ksadayamuthu -c user.email=ksadayamuthu@outlook.com \
            commit -m "unasked ${TAG#v}"
          git push

  # Points the major tag (v0 for v0.x.y) at this release, so workflows using
  # `sadayamuthu/unasked@v0` pick up action.yml changes. Skipped for
  # prereleases.
  action-tag:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move major tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
